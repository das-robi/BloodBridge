spring.application.name=BloodBridge

spring.datasource.url=jdbc:postgresql://localhost:5432/project2
spring.datasource.username=postgres
spring.datasource.password=abc123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Set JWT_SECRET to a cryptographically-random Base64 value (at least 32 bytes) in production.
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=PT5M
security.refresh-token.ttl=P30D

# FCM is deliberately opt-in. Credentials come from GOOGLE_APPLICATION_CREDENTIALS, never this file.
firebase.enabled=${FIREBASE_ENABLED:false}
app.matching.radius-km=10
# PostgreSQL must have PostGIS enabled by a DBA: CREATE EXTENSION IF NOT EXISTS postgis;

#logging.level.org.springframework.security=DEBUG
